<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loanword</title>
<style>
  :root {
    --bg: #111;
    --fg: #e9e9e6;
    --dim: #6d6d68;
    --accent: #e8c547;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans);
    display: grid; grid-template-rows: 2px 1fr auto; -webkit-font-smoothing: antialiased;
  }
  #progress { background: var(--accent); width: 0; transition: width 150ms linear; }
  main {
    display: grid; place-items: center; padding: 6vh 6vw; text-align: center;
    opacity: 1; transition: opacity 150ms ease;
  }
  main.turning { opacity: 0; }
  .card { max-width: 46rem; }
  .front { font-size: clamp(1.5rem, 4vw, 2.4rem); line-height: 1.3; font-weight: 500; }
  .front.term { font-family: var(--mono); color: var(--accent); }
  .back { margin-top: 2.2rem; }
  .back[hidden] { display: none; }
  .answer { font-size: clamp(1.2rem, 3vw, 1.7rem); line-height: 1.4; }
  .answer.term { font-family: var(--mono); color: var(--accent); }
  .keywords { margin-top: .9rem; font-family: var(--mono); font-size: .95rem; color: var(--accent); }
  .example { margin-top: 1.4rem; font-size: 1.05rem; line-height: 1.5; color: var(--fg); opacity: .8; }
  .origin { margin-top: 1.8rem; font-size: .85rem; color: var(--dim); }
  .hint { margin-top: 2.4rem; font-size: .8rem; color: var(--dim); letter-spacing: .04em; }
  footer { padding: 1.2rem; font-size: .75rem; color: var(--dim); text-align: center; letter-spacing: .04em; }
  kbd { font-family: var(--mono); color: var(--fg); opacity: .55; }
  button {
    font: inherit; font-size: .95rem; background: none; color: var(--dim);
    border: 1px solid #2a2a28; border-radius: 3px; padding: .5rem 1rem; cursor: pointer;
  }
  button:hover { color: var(--fg); border-color: var(--accent); }
  .grades { margin-top: 2rem; display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; }
  .empty { color: var(--dim); font-size: 1.1rem; line-height: 1.8; }
</style>

<div id="progress"></div>
<main id="main"></main>
<footer id="footer"></footer>

<script type="module">
const main = document.getElementById('main');
const footer = document.getElementById('footer');
const progress = document.getElementById('progress');

const GRADES = [null, 'Again', 'Hard', 'Good', 'Easy'];
let cards = [], cfg = {}, i = 0, revealed = false, busy = false;

const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function ago(ts, lang) {
  if (!ts) return '';
  const days = Math.round((Date.now() - new Date(ts)) / 864e5);
  try {
    return new Intl.RelativeTimeFormat(lang || 'en', { numeric: 'auto' }).format(-days, 'day');
  } catch {
    return `${days}d ago`;
  }
}

function render() {
  progress.style.width = `${(i / Math.max(cards.length, 1)) * 100}%`;
  const c = cards[i];
  if (!c) return done();

  // phrase: front is your own wording; word: front is the term you met.
  const termFront = c.type === 'word';
  const origin = [c.project, ago(c.ts, cfg.native)].filter(Boolean).join(' · ');

  main.innerHTML = `
    <div class="card">
      <div class="front ${termFront ? 'term' : ''}">${esc(c.front)}</div>
      <div class="back" ${revealed ? '' : 'hidden'}>
        <div class="answer ${termFront ? '' : 'term'}">${esc(c.back)}</div>
        ${c.keywords?.length ? `<div class="keywords">${esc(c.keywords.join('  ·  '))}</div>` : ''}
        ${c.example ? `<div class="example">${esc(c.example)}</div>` : ''}
        ${origin ? `<div class="origin">${esc(origin)}</div>` : ''}
        <div class="grades">
          ${[1, 2, 3, 4].map((n) => `<button data-grade="${n}">${n} ${GRADES[n]}</button>`).join('')}
          <button data-delete="1">✕ junk</button>
        </div>
      </div>
      ${revealed ? '' : '<div class="hint">SPACE</div>'}
    </div>`;
  footer.innerHTML = revealed
    ? '<kbd>1</kbd> again <kbd>2</kbd> hard <kbd>3</kbd> good <kbd>4</kbd> easy <kbd>d</kbd> junk <kbd>esc</kbd> quit'
    : '<kbd>space</kbd> show answer <kbd>esc</kbd> quit';
}

function done() {
  progress.style.width = '100%';
  main.innerHTML = `<p class="empty">${i ? `${i} reviewed. Done for today.` : 'Nothing due.<br>Run <b>/loanword:build</b> after a work session.'}</p>`;
  footer.innerHTML = '<a href="/export.csv" style="color:var(--dim)">export.csv</a>';
}

function turn(fn) {
  main.classList.add('turning');
  setTimeout(() => {
    fn();
    render();
    main.classList.remove('turning');
  }, 150);
}

async function post(path, payload) {
  await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
}

async function advance(request) {
  if (busy) return;
  busy = true;
  try {
    await request;
  } finally {
    busy = false;
  }
  turn(() => { i++; revealed = false; });
}

const grade = (n) => advance(post('/grade', { id: cards[i].id, rating: n }));
const junk = () => advance(post('/delete', { id: cards[i].id, reason: 'user marked junk in review' }));

addEventListener('keydown', (e) => {
  if (!cards[i]) return;
  if (e.key === 'Escape') return done();
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!revealed) { revealed = true; render(); }
    return;
  }
  if (!revealed) return;
  if (e.key >= '1' && e.key <= '4') grade(Number(e.key));
  if (e.key.toLowerCase() === 'd') junk();
});

main.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.grade) grade(Number(b.dataset.grade));
  if (b.dataset.delete) junk();
});

const res = await fetch('/due');
({ cards, config: cfg } = await res.json());
render();
</script>
